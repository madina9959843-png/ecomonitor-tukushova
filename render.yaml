services:
  - type: web
    name: ecomonitor-tukushova
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ECOMONITOR_ADMIN_PASSWORD
        sync: false
      - key: ECOMONITOR_SESSION_SECRET
        generateValue: true
      - key: ECOMONITOR_SECURE_COOKIES
        value: "true"
      - key: ECOMONITOR_RESET_ON_START
        value: "true"
      - key: ECOMONITOR_DB
        value: /tmp/eco_monitor.db
